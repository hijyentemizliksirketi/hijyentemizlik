<title>404 — Sayfa Bulunamadı | Hijyen Temizlik</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Sora","Inter",system-ui,sans-serif;background:linear-gradient(165deg,#081120,#0C1E38);color:#fff;min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem}
.wrap{max-width:560px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(92deg,#2E90FA,#34E3C6);display:grid;place-items:center;margin:0 auto 2rem}
.logo svg{width:30px;height:30px;color:#04212E}
.code{font-size:clamp(4.5rem,16vw,7rem);font-weight:800;letter-spacing:-.04em;line-height:1;background:linear-gradient(92deg,#2E90FA,#34E3C6);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(1.4rem,4vw,2rem);font-weight:700;margin:1.2rem 0 .8rem}
p{color:#9FB4CB;line-height:1.7;margin-bottom:2rem}
a.btn{display:inline-flex;align-items:center;gap:.6rem;background:linear-gradient(92deg,#2E90FA,#34E3C6);color:#04212E;font-weight:700;text-decoration:none;padding:1rem 1.8rem;border-radius:999px;transition:transform .3s}
a.btn:hover{transform:translateY(-3px)}
.phone{margin-top:1.6rem;font-size:.9rem;color:#7E9BB8}
.phone a{color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7s6.5 7 6.5 11.3a6.5 6.5 0 0 1-13 0C5.5 9.7 12 2.7 12 2.7Z"/></svg></div>

  <div class="phone">Ya da arayın: <a href="tel:+905539852274">0553 985 22 74</a></div>
</div>
</body>
</html>
